pre-commit:
  parallel: true
  commands:
    lint:
      glob: '*.{js,ts,jsx,tsx}'
      run: fnm exec --using .nvmrc yarn oxlint {staged_files}

    types:
      glob: '*.{js,ts, jsx, tsx}'
      run: npx tsc

    cpp-style:
      glob: '{cpp,android/src/main/cpp}/**/*.{h,cc}'
      run: bash tools/cpp/check_staged.sh {staged_files}
commit-msg:
  parallel: true
  commands:
    commitlint:
      run: npx commitlint --edit
