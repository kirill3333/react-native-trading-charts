buildscript {
  ext.TradingCharts = [
    kotlinVersion: "2.1.20",
    minSdkVersion: 24,
    compileSdkVersion: 35
  ]

  ext.getExtOrDefault = { prop ->
    if (rootProject.ext.has(prop)) {
      return rootProject.ext.get(prop)
    }

    return TradingCharts[prop]
  }

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    // Use the Android Gradle Plugin version supplied by the host React Native build.
    classpath "com.facebook.react:react-native-gradle-plugin"
    // noinspection DifferentKotlinGradleVersion
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOrDefault('kotlinVersion')}"
  }
}


apply plugin: "com.android.library"
apply plugin: "kotlin-android"

apply plugin: "com.facebook.react"

android {
  namespace = "com.tradingcharts"

  compileSdkVersion getExtOrDefault("compileSdkVersion")

  buildFeatures {
    buildConfig = true
  }

  defaultConfig {
    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    buildConfigField "boolean", "TRADING_CHARTS_EXAMPLE_DIAGNOSTICS",
        (findProperty("TRADING_CHARTS_EXAMPLE_DIAGNOSTICS") ?: "false").toString()

    minSdkVersion getExtOrDefault("minSdkVersion")
    externalNativeBuild {
      cmake {
        cppFlags "-std=c++17"
        arguments "-DANDROID_STL=c++_shared", "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
      }
    }
  }

  externalNativeBuild {
    cmake {
      path "CMakeLists.txt"
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  testOptions {
    unitTests.returnDefaultValues = true
  }
}

androidComponents.onVariants(androidComponents.selector().all()) { variant ->
  variant.androidTest?.packaging?.jniLibs?.pickFirsts?.add("**/libc++_shared.so")
}

dependencies {
  implementation "com.facebook.react:react-android"
  implementation "org.threeten:threetenbp:1.7.5"
  androidTestImplementation "androidx.test:runner:1.7.0"
  androidTestImplementation "androidx.test.ext:junit:1.3.0"
  testImplementation "junit:junit:4.13.2"
}
