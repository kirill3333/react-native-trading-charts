name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
    types:
      - checks_requested

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpp:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Install LLVM 22
        run: |
          wget -qO /tmp/llvm-snapshot.gpg.key https://apt.llvm.org/llvm-snapshot.gpg.key
          sudo install -m 0644 /tmp/llvm-snapshot.gpg.key /usr/share/keyrings/llvm-snapshot.gpg.key
          echo "deb [signed-by=/usr/share/keyrings/llvm-snapshot.gpg.key] https://apt.llvm.org/noble/ llvm-toolchain-noble-22 main" | sudo tee /etc/apt/sources.list.d/llvm-22.list
          sudo apt-get update
          sudo apt-get install --yes clang-22

      - name: Install pinned style tools
        run: bash tools/cpp/bootstrap.sh

      - name: Install JDK for JNI analysis
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Check C++ formatting
        run: bash tools/cpp/format.sh --dry-run --Werror

      - name: Run cpplint
        run: bash tools/cpp/lint.sh

      - name: Run clang-tidy
        run: bash tools/cpp/tidy.sh

      - name: Run C++ tests
        run: bash tools/cpp/test.sh

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Lint files
        run: yarn lint

      - name: Typecheck files
        run: yarn typecheck

  swift:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Validate Swift
        run: swiftlint lint --strict --no-cache

      - name: Test Swift buffer ownership and frame scheduling
        run: bash tools/swift/test.sh

  kotlin:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Install JDK
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-kotlin-${{ hashFiles('example/android/gradle/wrapper/gradle-wrapper.properties', 'tools/kotlin/**') }}
          restore-keys: |
            ${{ runner.os }}-gradle-kotlin-
            ${{ runner.os }}-gradle-

      - name: Validate Kotlin
        run: yarn lint:kotlin

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run unit tests
        run: yarn test --maxWorkers=2 --coverage

  build-library:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build package
        run: yarn prepare

  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Install JDK
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Restore Android build result
        id: build-cache
        uses: ./.github/actions/native-build-cache
        with:
          task: build:android

      - name: Set up Gradle dependency and build caches
        if: steps.build-cache.outputs.cache-hit != 'true'
        uses: gradle/actions/setup-gradle@4d9f0ba0025fe599b4ebab900eb7f3a1d93ef4c2 # v5.0.0
        with:
          cache-read-only: false

      - name: Finalize Android SDK
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: /bin/bash -c 'yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null'

      - name: Build example for Android
        run: yarn turbo run build:android --env-mode=loose --output-logs=new-only --log-order=stream

  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@60606e260d2fc5762a71e64e74b2174e8ea3c8bd # v1.6.0
        with:
          xcode-version: '26'

      - name: Restore iOS build result
        id: build-cache
        uses: ./.github/actions/native-build-cache
        with:
          task: build:ios

      - name: Cache Ruby gems
        if: steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: example/vendor/bundle
          key: ${{ runner.os }}-${{ runner.arch }}-gems-${{ steps.build-cache.outputs.image-version }}-${{ hashFiles('example/Gemfile*', 'example/.bundle/config') }}

      - name: Cache React Native and Hermes downloads
        if: steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            example/ios/Pods/ReactNativeCore-artifacts
            example/ios/Pods/ReactNativeDependencies-artifacts
            example/ios/Pods/hermes-engine-artifacts
          key: ${{ runner.os }}-rn-archives-${{ hashFiles('example/ios/Podfile.lock', 'yarn.lock') }}

      # Reuse compiled modules and object files even when chart sources change.
      - name: Cache Xcode compilations
        if: steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/Library/Developer/Xcode/DerivedData/CompilationCache.noindex
          key: xcode-cas-${{ runner.arch }}-${{ steps.build-cache.outputs.image-version }}-${{ hashFiles('example/ios/Podfile.lock', 'yarn.lock') }}

      - name: Build example for iOS
        run: yarn turbo run build:ios --env-mode=loose --output-logs=new-only --log-order=stream
