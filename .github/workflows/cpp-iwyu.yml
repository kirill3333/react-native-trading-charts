name: C++ Include What You Use

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 1 * *'

jobs:
  iwyu:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Install LLVM 22 build dependencies
        run: |
          wget -qO /tmp/llvm-snapshot.gpg.key https://apt.llvm.org/llvm-snapshot.gpg.key
          sudo install -m 0644 /tmp/llvm-snapshot.gpg.key /usr/share/keyrings/llvm-snapshot.gpg.key
          echo "deb [signed-by=/usr/share/keyrings/llvm-snapshot.gpg.key] https://apt.llvm.org/noble/ llvm-toolchain-noble-22 main" | sudo tee /etc/apt/sources.list.d/llvm-22.list
          sudo apt-get update
          sudo apt-get install --yes clang-22 libclang-22-dev llvm-22-dev ninja-build

      - name: Build IWYU 0.26
        run: |
          git clone --branch 0.26 --depth 1 https://github.com/include-what-you-use/include-what-you-use.git "$RUNNER_TEMP/iwyu-source"
          cmake -S "$RUNNER_TEMP/iwyu-source" -B "$RUNNER_TEMP/iwyu-build" -G Ninja -DCMAKE_PREFIX_PATH=/usr/lib/llvm-22 -DCMAKE_C_COMPILER=clang-22 -DCMAKE_CXX_COMPILER=clang++-22 -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/iwyu"
          cmake --build "$RUNNER_TEMP/iwyu-build" --parallel
          cmake --install "$RUNNER_TEMP/iwyu-build"
          echo "$RUNNER_TEMP/iwyu/bin" >> "$GITHUB_PATH"

      - name: Check include dependencies
        env:
          CC: clang-22
          CXX: clang++-22
        run: bash tools/cpp/iwyu.sh
